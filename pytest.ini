[pytest]
testpaths = tests
addopts = -ra
markers =
    integracion: usa los datos reales (CSV de la ECV y copia del perfilamiento de EVA); tarda alrededor de un minuto
    warehouse: requiere el warehouse PostgreSQL arriba y ETL_DATABASE_URL definida
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
